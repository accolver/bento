# Bento Development Tasks
# Run `mise tasks` to see all available tasks
# Run `mise run <task>` or `mise <task>` to execute

[tools]
flutter = "latest"

[env]
# Device IDs for Pixel 9 Pro
BENTO_DEVICE_WIRELESS = "100.126.177.104:43455"
BENTO_DEVICE_WIRED = "4C091FDAP0032A"

# =============================================================================
# Device Selection Helper
# =============================================================================

# Helper script to get available device (wireless preferred, wired fallback)
[tasks."_device"]
description = "Get or boot an available mobile device ID (internal helper)"
run = '''
set -e

# 1) Prefer explicitly configured physical devices.
if flutter devices 2>/dev/null | grep -q "$BENTO_DEVICE_WIRELESS"; then
  echo "$BENTO_DEVICE_WIRELESS"
  exit 0
fi

if flutter devices 2>/dev/null | grep -q "$BENTO_DEVICE_WIRED"; then
  echo "$BENTO_DEVICE_WIRED"
  exit 0
fi

# 2) Reuse any already-running Android emulator.
RUNNING_ANDROID=$(flutter devices 2>/dev/null | awk -F ' • ' '/emulator-[0-9]+ • android-/{print $2; exit}')
if [ -n "$RUNNING_ANDROID" ]; then
  echo "$RUNNING_ANDROID"
  exit 0
fi

# 3) Reuse any already-running iOS simulator.
RUNNING_IOS=$(flutter devices 2>/dev/null | awk -F ' • ' '/ • ios •/{print $2; exit}')
if [ -n "$RUNNING_IOS" ]; then
  echo "$RUNNING_IOS"
  exit 0
fi

# 4) Boot the first available emulator and wait for it to appear.
EMULATOR_ID=$(flutter emulators 2>/dev/null | awk '/^[A-Za-z0-9_.-]+[[:space:]]+•/ && $1 != "Id" {print $1; exit}')
if [ -n "$EMULATOR_ID" ]; then
  echo "Launching emulator: $EMULATOR_ID" >&2
  flutter emulators --launch "$EMULATOR_ID" >/dev/null

  for _ in $(seq 1 24); do
    sleep 5
    RUNNING_ANDROID=$(flutter devices 2>/dev/null | awk -F ' • ' '/emulator-[0-9]+ • android-/{print $2; exit}')
    if [ -n "$RUNNING_ANDROID" ]; then
      echo "$RUNNING_ANDROID"
      exit 0
    fi
  done

  echo "Timed out waiting for emulator '$EMULATOR_ID' to boot." >&2
  exit 1
fi

echo "No supported mobile devices or emulators found." >&2
echo "Tip: run 'flutter emulators' to create/start one, or connect a device." >&2
exit 1
'''

# =============================================================================
# Build Tasks
# =============================================================================

[tasks.build]
alias = "b"
description = "Build debug APK"
run = "flutter build apk --debug"

[tasks."build:release"]
alias = "br"
description = "Build release APK"
run = "flutter build apk --release"

[tasks."build:bundle"]
description = "Build Android App Bundle for Play Store"
run = "flutter build appbundle --release"

# =============================================================================
# Install & Run Tasks
# =============================================================================

[tasks.install]
alias = "i"
description = "Install debug APK to connected device or emulator"
depends = ["build"]
run = '''
DEVICE=$(mise run _device)
echo "Using device: $DEVICE"
flutter install --debug -d "$DEVICE"
'''

[tasks."install:release"]
alias = "ir"
description = "Install release APK to connected device or emulator"
depends = ["build:release"]
run = '''
DEVICE=$(mise run _device)
echo "Using device: $DEVICE"
flutter install --release -d "$DEVICE"
'''

[tasks.run]
alias = "r"
description = "Run app on connected device or emulator with hot reload"
run = '''
DEVICE=$(mise run _device)
echo "Using device: $DEVICE"
flutter run -d "$DEVICE"
'''

[tasks."run:release"]
description = "Run release build on device or emulator"
run = '''
DEVICE=$(mise run _device)
echo "Using device: $DEVICE"
flutter run --release -d "$DEVICE"
'''

[tasks.hot]
alias = "h"
description = "Run with hot reload (same as run)"
run = '''
DEVICE=$(mise run _device)
echo "Using device: $DEVICE"
flutter run -d "$DEVICE"
'''

# =============================================================================
# Test Tasks
# =============================================================================

[tasks.test]
alias = "t"
description = "Run all tests"
run = "flutter test"

[tasks."test:ai"]
description = "Run AI feature tests"
run = "flutter test test/features/ai/"

[tasks."test:terminal"]
description = "Run terminal feature tests"
run = "flutter test test/features/terminal/"

[tasks."test:watch"]
alias = "tw"
description = "Run tests in watch mode"
run = "flutter test --watch"

[tasks."test:coverage"]
description = "Run tests with coverage report"
run = "flutter test --coverage && genhtml coverage/lcov.info -o coverage/html"

# =============================================================================
# Code Quality Tasks
# =============================================================================

[tasks.analyze]
alias = "a"
description = "Run static analysis"
run = "flutter analyze"

[tasks.format]
alias = "f"
description = "Format all Dart code"
run = "dart format lib test"

[tasks."format:check"]
description = "Check formatting without changes"
run = "dart format --set-exit-if-changed lib test"

[tasks.lint]
alias = "l"
description = "Run analyzer and format check"
depends = ["analyze", "format:check"]

[tasks.fix]
description = "Auto-fix analyzable issues"
run = "dart fix --apply"

# =============================================================================
# Code Generation Tasks
# =============================================================================

[tasks.gen]
alias = "g"
description = "Run build_runner code generation"
run = "flutter pub run build_runner build --delete-conflicting-outputs"

[tasks."gen:watch"]
alias = "gw"
description = "Run build_runner in watch mode"
run = "flutter pub run build_runner watch --delete-conflicting-outputs"

[tasks.clean]
alias = "c"
description = "Clean build artifacts and regenerate"
run = '''
flutter clean
flutter pub get
flutter pub run build_runner build --delete-conflicting-outputs
'''

# =============================================================================
# Device Management Tasks
# =============================================================================

[tasks.emulator]
description = "Launch the first available Flutter emulator"
run = '''
EMULATOR_ID=$(flutter emulators 2>/dev/null | awk '/^[A-Za-z0-9_.-]+[[:space:]]+•/ && $1 != "Id" {print $1; exit}')
if [ -z "$EMULATOR_ID" ]; then
  echo "No emulator available. Run 'flutter emulators' to inspect or create one." >&2
  exit 1
fi

echo "Launching emulator: $EMULATOR_ID"
flutter emulators --launch "$EMULATOR_ID"
'''

[tasks."emulator:list"]
description = "List available Flutter emulators"
run = "flutter emulators"

[tasks.android]
description = "Run app on Android device or emulator with hot reload"
run = '''
DEVICE=$(mise run _device)
echo "Using Android device: $DEVICE"
flutter run -d "$DEVICE"
'''

[tasks.ios]
description = "Run app on iOS simulator or device with hot reload"
run = '''
DEVICE=$(flutter devices 2>/dev/null | awk -F ' • ' '/ • ios •/{print $2; exit}')
if [ -z "$DEVICE" ]; then
  echo "No iOS simulator/device detected." >&2
  echo "Open Simulator.app first, then re-run this task." >&2
  exit 1
fi

echo "Using iOS device: $DEVICE"
flutter run -d "$DEVICE"
'''

[tasks.devices]
alias = "d"
description = "List connected devices"
run = "flutter devices"

[tasks.logs]
description = "Show device logs (filtered for Bento)"
run = '''
DEVICE=$(adb devices | grep -q "$BENTO_DEVICE_WIRELESS" && echo "$BENTO_DEVICE_WIRELESS" || echo "$BENTO_DEVICE_WIRED")
adb -s "$DEVICE" logcat | grep -E '(flutter|bento|Llama)'
'''

[tasks."logs:all"]
description = "Show all device logs"
run = '''
DEVICE=$(adb devices | grep -q "$BENTO_DEVICE_WIRELESS" && echo "$BENTO_DEVICE_WIRELESS" || echo "$BENTO_DEVICE_WIRED")
adb -s "$DEVICE" logcat
'''

[tasks."logs:clear"]
description = "Clear device logs"
run = '''
DEVICE=$(adb devices | grep -q "$BENTO_DEVICE_WIRELESS" && echo "$BENTO_DEVICE_WIRELESS" || echo "$BENTO_DEVICE_WIRED")
adb -s "$DEVICE" logcat -c
'''

# =============================================================================
# ADB Wireless Tasks
# =============================================================================

[tasks."adb:pair"]
description = "Pair with device for wireless debugging"
usage = '''
arg "<ip:port>" help="Device IP:port from Wireless debugging > Pair"
arg "<code>" help="6-digit pairing code"
'''
run = "adb pair $usage_ip_port $usage_code"

[tasks."adb:connect"]
description = "Connect to paired wireless device"
usage = 'arg "<ip:port>" help="Device IP:port from Wireless debugging screen"'
run = "adb connect $usage_ip_port"

[tasks."adb:disconnect"]
description = "Disconnect all wireless devices"
run = "adb disconnect"

[tasks."adb:restart"]
description = "Restart ADB server"
run = "adb kill-server && adb start-server"

# =============================================================================
# Utility Tasks
# =============================================================================

[tasks.deps]
description = "Get dependencies"
run = "flutter pub get"

[tasks.upgrade]
description = "Upgrade dependencies"
run = "flutter pub upgrade"

[tasks.outdated]
description = "Show outdated dependencies"
run = "flutter pub outdated"

[tasks.doctor]
description = "Run Flutter doctor"
run = "flutter doctor -v"

[tasks.size]
description = "Analyze APK size"
run = "flutter build apk --analyze-size"

# =============================================================================
# Git Tasks
# =============================================================================

[tasks.status]
alias = "s"
description = "Git status"
run = "git status"

[tasks.diff]
description = "Git diff"
run = "git diff"

[tasks.commit]
description = "Git add all and commit"
usage = 'arg "<message>" help="Commit message"'
run = "git add -A && git commit -m \"$usage_message\""

# =============================================================================
# Combined Workflow Tasks
# =============================================================================

[tasks.dev]
description = "Full dev setup: deps, generate, run on device or emulator"
run = '''
flutter pub get
flutter pub run build_runner build --delete-conflicting-outputs
DEVICE=$(mise run _device)
echo "Using device: $DEVICE"
flutter run -d "$DEVICE"
'''

[tasks.ci]
description = "Run CI checks: analyze, format, test"
depends = ["analyze", "format:check", "test"]

[tasks.ship]
description = "Build and install release to device"
depends = ["ci", "install:release"]

[tasks.refresh]
description = "Clean rebuild and install"
depends = ["clean", "install"]

# =============================================================================
# AI Model Tasks
# =============================================================================

[tasks."model:list"]
description = "List downloaded AI models"
run = '''
DEVICE=$(adb devices | grep -q "$BENTO_DEVICE_WIRELESS" && echo "$BENTO_DEVICE_WIRELESS" || echo "$BENTO_DEVICE_WIRED")
echo "Downloaded models in app data:"
adb -s "$DEVICE" shell ls -lh /data/data/com.example.bento/app_flutter/bento/models/ 2>/dev/null || echo "No models downloaded yet"
'''

[tasks."model:clear"]
description = "Clear downloaded AI models from device"
confirm = "This will delete all downloaded AI models. Continue?"
run = '''
DEVICE=$(adb devices | grep -q "$BENTO_DEVICE_WIRELESS" && echo "$BENTO_DEVICE_WIRELESS" || echo "$BENTO_DEVICE_WIRED")
adb -s "$DEVICE" shell rm -rf /data/data/com.example.bento/app_flutter/bento/models/
'''
