name: bento
description: A next-generation mobile terminal with semantic blocks and AI assistance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^2.4.0

  # Navigation
  go_router: ^13.0.0

  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.0

  # SSH/Terminal
  dartssh2: ^2.13.0
  xterm: ^4.0.0

  # Functional Programming
  fpdart: ^1.1.0

  # Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # UI
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0

  # Utils
  uuid: ^4.2.0
  collection: ^1.18.0
  intl: ^0.19.0
  logger: ^2.0.0
  equatable: ^2.0.5

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Biometric Authentication
  local_auth: ^2.2.0

  # File Picker
  file_picker: ^8.0.0



  # Local AI / LLM
  llama_flutter_android: ^0.1.1

  # Platform
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  drift_dev: ^2.14.0

  # Linting
  flutter_lints: ^3.0.0

  # Testing
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/
    - assets/models/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    # Nerd Font version with Unicode glyphs for Starship/Powerline prompts
    # Note: Use custom family name since the internal name has spaces
    - family: JetBrainsMonoNF
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFont-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNerdFont-Bold.ttf
          weight: 700
